// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ConfigUtils.init(gradle)
    repositories {
        mavenLocal()
//        google()
//        mavenCentral()
//        jcenter
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'}

    }

    dependencies {
        for (def entrySet : ConfigUtils.getApplyPlugins().entrySet()) {
            def depPath = entrySet.value.path
            if (depPath instanceof String) {
                println "Adding classpath dependency: ${depPath}"
                classpath depPath
            } else {
                println "Warning: Dependency path is not a String: ${depPath}"
                // 可以选择抛出错误或尝试转换
                // classpath depPath.toString()
            }
        }
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven { url "https://jitpack.io" }
//        google()
//        mavenCentral()
//        jcenter()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/google' }
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public' }
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/jcenter'}

    }

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'

        resolutionStrategy.eachDependency {
            if (it.requested.group == 'com.android.support' && !it.requested.name.contains(
                    'multidex')) {
                it.useVersion Config.supportVersion
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}